name: Cypress tests

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    - cron: '0 10 * * 1'
  pull_request:
  push:
    branches: [main, master]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static analysis
        run: npm run quality:static

      - name: Dependency audit
        run: npm run audit:dependencies

  tests:
    needs: static-analysis
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - layer: api
            command: test:api
            browser: electron
          - layer: frontend
            command: test:e2e
            browser: chrome
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ${{ matrix.layer }} tests
        run: npm run ${{ matrix.command }} -- --browser ${{ matrix.browser }}

      - name: Add results to the workflow summary
        if: always() && hashFiles('reports/test-results.json') != ''
        run: npm run report:github

      - name: Publish test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-evidence-${{ matrix.layer }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            reports/
            cypress/screenshots/
